name: demo
baseUrl: http://127.0.0.1:4173
options:
  ordered: false
  match: partial
  forbidExtra: false
adapters:
  - snowplow
steps:
  - action: goto
    path: /
  - action: waitForEvent
    eventName: page_view
    timeoutMs: 5000
  - action: click
    selector: "#cta"
  - action: waitForEvent
    eventName: cta_click
    timeoutMs: 5000
expect:
  - eventName: page_view
    properties:
      page: home
  - eventName: cta_click
    properties:
      button_id: cta
