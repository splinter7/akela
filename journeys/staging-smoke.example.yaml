name: staging-smoke
# Copy to journeys/staging-smoke.yaml and customize.
# Do not commit real credentials. Create storage state once, keep it local.

baseUrl: https://staging.example.com
storageState: .auth/storage-state.json
gotoWaitUntil: domcontentloaded
options:
  ordered: false
  match: partial
  forbidExtra: false
adapters:
  - snowplow
steps:
  - action: goto
    path: /
  - action: waitForSelector
    selector: body
    timeoutMs: 10000
